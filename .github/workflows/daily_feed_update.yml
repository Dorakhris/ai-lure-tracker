name: Daily AI Lure CTI Feed Sync

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-cti-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -r pyproject.toml

      - name: Run AI Lure Tracker Pipeline
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: |
          .venv/bin/python -m src.cli run-pipeline

      - name: Commit and Push Updated Threat Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ reports/ data/
          git diff --staged --quiet || (git commit -m "chore(feeds): automated daily threat intelligence sync [skip ci]" && git push)
