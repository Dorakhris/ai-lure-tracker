# AI Lure Tracker - Application Settings & Threat Intelligence Parameters

app:
  name: "AI Lure Tracker"
  version: "1.0.0"
  log_level: "INFO"
  database_path: "data/ai_lures.db"
  feeds_dir: "feeds"
  reports_dir: "reports"

feeds:
  abuse_ch:
    urlhaus_recent_url: "https://urlhaus-api.abuse.ch/v1/urls/recent/"
    threatfox_recent_url: "https://threatfox-api.abuse.ch/v1/"
    malwarebazaar_recent_url: "https://mb-api.abuse.ch/api/v1/"
    request_timeout: 15
    max_records: 1000

  openphish:
    feed_url: "https://openphish.com/feed.txt"
    request_timeout: 15

  phishtank:
    feed_url: "http://data.phishtank.com/data/online-valid.json"
    request_timeout: 30

  certstream:
    websocket_url: "wss://certstream.calidog.io"
    reconnect_delay: 5
    buffer_size: 500

  pypi:
    rss_new_url: "https://pypi.org/rss/packages.xml"
    rss_updates_url: "https://pypi.org/rss/updates.xml"
    poll_interval_seconds: 300

  npm:
    changes_url: "https://replicate.npmjs.com/_changes?include_docs=true&limit=100&descending=true"
    poll_interval_seconds: 300

filtering:
  typosquat_max_levenshtein: 2
  min_keyword_length: 3
  suspicious_tlds:
    - ".top"
    - ".icu"
    - ".buzz"
    - ".lat"
    - ".site"
    - ".online"
    - ".cfd"
    - ".sbs"
    - ".rest"
    - ".monster"
    - ".quest"
    - ".xyz"
    - ".club"
    - ".live"
    - ".cc"
    - ".tk"
    - ".ml"
    - ".ga"
    - ".cf"

enrichment:
  enable_whois: true
  enable_dns: true
  enable_urlscan: true
  enable_virustotal: true
  enable_shodan: true
  whois_timeout: 6
  dns_timeout: 4
  urlscan_api_key_env: "URLSCAN_API_KEY"
  virustotal_api_key_env: "VIRUSTOTAL_API_KEY"
  shodan_api_key_env: "SHODAN_API_KEY"
  rate_limit_delay: 1.0

confidence_scoring:
  base_score: 40
  new_domain_less_than_7_days: 25
  new_domain_less_than_14_days: 15
  new_domain_less_than_30_days: 10
  suspicious_tld_match: 15
  executable_payload_lure: 30
  credential_login_lure: 25
  abuse_ch_confirmed: 30
  virustotal_malicious_detection: 25
  typosquat_distance_1: 20
  typosquat_distance_2: 10
  high_threshold: 75
  medium_threshold: 50

stix:
  identity_name: "AI Lure Tracker CTI Initiative"
  identity_class: "organization"
  tlp_marking: "TLP:CLEAR"
  contact_information: "cti@ailuretracker.local"
