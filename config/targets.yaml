# 3. Known Malicious Payload Patterns (Infostealers & Fake Installers)
malware_families:
  - name: "LummaC2"
    type: "Infostealer"
    delivery: "Fake AI installer (.exe, .msi, zipped ISO)"
  - name: "Stealc"
    type: "Infostealer"
    delivery: "Fake ChatGPT / Midjourney downloads"
  - name: "Vidar"
    type: "Infostealer"
    delivery: "Trojanized desktop packages"
  - name: "Rhadamanthys"
    type: "Infostealer"
    delivery: "Google Ads -> Fake AI landing page -> trojanized archive"
  - name: "RedLine"
    type: "Infostealer"
    delivery: "Cracked AI software / free token generators"
  - name: "AMOS"
    name_full: "Atomic macOS Stealer"
    type: "macOS Stealer"
    delivery: "Trojanized .dmg installer masquerading as Claude/ChatGPT desktop app"

