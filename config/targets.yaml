# AI Lure Tracker - Target AI Brands, Libraries, and Detection Rules

# 1. AI Brands & Service Ecosystems
brands:
  openai:
    name: "OpenAI / ChatGPT"
    keywords: ["openai", "chatgpt", "dall-e", "sora", "gpt-4", "gpt-4o", "gpt-5", "o1-preview", "o1-mini"]
    official_domains:
      - "openai.com"
      - "chatgpt.com"
      - "oaistatic.com"
      - "oaiusercontent.com"
    typical_lures:
      - "chatgpt-desktop"
      - "chatgpt-free"
      - "chatgpt-plus"
      - "chatgpt-pro"
      - "chatgpt-installer"
      - "chatgpt-windows"
      - "chatgpt-mac"

  anthropic:
    name: "Anthropic / Claude"
    keywords: ["anthropic", "claude", "claude-3", "claude-3.5", "claude-sonnet", "claude-opus", "claude-haiku"]
    official_domains:
      - "anthropic.com"
      - "claude.ai"
    typical_lures:
      - "claude-desktop"
      - "claude-pro-free"
      - "claude-installer"
      - "claude-ai-login"

  google_ai:
    name: "Google AI / Gemini"
    keywords: ["gemini", "bard", "google-gemini", "gemini-pro", "gemini-ultra", "gemini-advanced"]
    official_domains:
      - "google.com"
      - "gemini.google.com"
      - "deepmind.google"
    typical_lures:
      - "gemini-app"
      - "gemini-desktop"
      - "gemini-installer"
      - "gemini-pro-free"

  microsoft_copilot:
    name: "Microsoft Copilot"
    keywords: ["copilot", "ms-copilot", "github-copilot", "bing-copilot"]
    official_domains:
      - "microsoft.com"
      - "copilot.microsoft.com"
      - "github.com"
    typical_lures:
      - "copilot-desktop"
      - "copilot-setup"
      - "copilot-free"

  deepseek:
    name: "DeepSeek"
    keywords: ["deepseek", "deepseek-coder", "deepseek-v2", "deepseek-v3", "deepseek-r1"]
    official_domains:
      - "deepseek.com"
    typical_lures:
      - "deepseek-install"
      - "deepseek-app"
      - "deepseek-free"

  midjourney:
    name: "Midjourney"
    keywords: ["midjourney", "mid-journey"]
    official_domains:
      - "midjourney.com"
    typical_lures:
      - "midjourney-pc"
      - "midjourney-free"
      - "midjourney-installer"
      - "midjourney-v6"

  ollama:
    name: "Ollama"
    keywords: ["ollama", "ollama-ai"]
    official_domains:
      - "ollama.com"
      - "ollama.ai"
    typical_lures:
      - "ollama-installer"
      - "ollama-desktop-setup"

  perplexity:
    name: "Perplexity AI"
    keywords: ["perplexity", "perplexity-ai"]
    official_domains:
      - "perplexity.ai"
    typical_lures:
      - "perplexity-pro-free"
      - "perplexity-desktop"

  general_ai_terms:
    name: "Generic AI / Agentic Terms"
    keywords: ["ai-agent", "agentic-ai", "genai", "super-gpt", "auto-gpt", "ai-installer", "ai-assistant"]
    official_domains: []
    typical_lures:
      - "ai-installer"
      - "ai-desktop"
      - "free-ai-tools"

# 2. Popular Python & Node.js AI Libraries Targeted by Dependency Confusion / Typosquatting
targeted_packages:
  - name: "openai"
    ecosystems: ["pypi", "npm"]
    criticality: "high"
  - name: "anthropic"
    ecosystems: ["pypi", "npm"]
    criticality: "high"
  - name: "langchain"
    ecosystems: ["pypi", "npm"]
    criticality: "high"
