[project]
name = "ai-lure-tracker"
version = "1.0.0"
description = "A live Cyber Threat Intelligence feed tracking malicious infrastructure and packages abusing AI brands"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "dnspython>=2.6.0",
    "websockets>=12.0",
    "feedparser>=6.0.10",
    "rich>=13.7.0",
    "python-dateutil>=2.8.2",
    "idna>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
