version: '3.8'

# AI Lure Tracker - Local CTI Platform Stack (MISP & OpenCTI)
# Usage:
#   To run MISP:    docker compose --profile misp up -d
#   To run OpenCTI: docker compose --profile opencti up -d
#   To run both:    docker compose --profile misp --profile opencti up -d

services:
  # ==========================================
  # OpenCTI Stack (Profile: opencti)
  # ==========================================
  opencti-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    profiles: ["opencti"]
    volumes:
      - opencti_redis_data:/data

  opencti-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    profiles: ["opencti"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - opencti_es_data:/usr/share/elasticsearch/data

  opencti-minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: unless-stopped
    profiles: ["opencti"]
    environment:
      - MINIO_ROOT_USER=opencti
      - MINIO_ROOT_PASSWORD=opencti_minio_password_123
    volumes:
      - opencti_minio_data:/data
    command: server /data

  opencti-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    profiles: ["opencti"]
    environment:
      - RABBITMQ_DEFAULT_USER=opencti
      - RABBITMQ_DEFAULT_PASS=opencti_rabbitmq_password_123
    volumes:
      - opencti_rabbitmq_data:/var/lib/rabbitmq

  opencti:
    image: opencti/platform:6.3.3
    restart: unless-stopped
    profiles: ["opencti"]
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - APP__BASE_URL=http://localhost:8080
      - APP__ADMIN__EMAIL=admin@opencti.io
      - APP__ADMIN__PASSWORD=admin_password_123
      - APP__ADMIN__TOKEN=4b6e5113-1cf0-4bb5-bb26-38290352e463
      - REDIS__HOSTNAME=opencti-redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://opencti-elasticsearch:9200
      - MINIO__ENDPOINT=opencti-minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=opencti
      - MINIO__SECRET_KEY=opencti_minio_password_123
      - RABBITMQ__HOSTNAME=opencti-rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USER=opencti
      - RABBITMQ__PASSWORD=opencti_rabbitmq_password_123
    depends_on:
      - opencti-redis
      - opencti-elasticsearch
      - opencti-minio
      - opencti-rabbitmq

  # ==========================================
  # MISP Stack (Profile: misp)
  # ==========================================
  misp-core:
    image: coolacid/misp-docker:core-latest
    restart: unless-stopped
    profiles: ["misp"]
    ports:
      - "8443:443"
      - "8000:80"
    environment:
      - "MYSQL_HOST=misp-db"
      - "MYSQL_USER=misp"
      - "MYSQL_PASSWORD=misp_db_password_123"
      - "MYSQL_DATABASE=misp"
      - "MISP_ADMIN_EMAIL=admin@admin.test"
      - "MISP_ADMIN_PASSPHRASE=admin"
      - "MISP_BASEURL=https://localhost:8443"
      - "INIT=true"
    depends_on:
      - misp-db
      - misp-redis

  misp-db:
    image: mysql/mysql-server:8.0
    restart: unless-stopped
    profiles: ["misp"]
    environment:
      - "MYSQL_USER=misp"
      - "MYSQL_PASSWORD=misp_db_password_123"
      - "MYSQL_DATABASE=misp"
      - "MYSQL_ROOT_PASSWORD=misp_root_password_123"
    volumes:
      - misp_mysql_data:/var/lib/mysql

  misp-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    profiles: ["misp"]
    volumes:
      - misp_redis_data:/data

volumes:
  opencti_redis_data:
  opencti_es_data:
  opencti_minio_data:
  opencti_rabbitmq_data:
  misp_mysql_data:
  misp_redis_data:
